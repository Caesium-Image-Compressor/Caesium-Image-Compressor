[package]
authors = ["Matteo Paonessa <matteo.paonessa@gmail.com>"]
categories = ["multimedia::images"]
description = "A fast and efficient lossy and/or lossless image compression tool"
edition = "2021"
exclude = [
  "tests/*",
  ".github/*",
  ".idea/*",
  "samples/*",
]
homepage = "https://github.com/Lymphatus/caesium-clt"
keywords = [
  "compression",
  "console",
]
license = "Apache-2.0"
name = "caesiumclt"
readme = "README.md"
repository = "https://github.com/Lymphatus/caesium-clt"
version = "1.5.0"

[dependencies]
bytesize = "2.0"
clap = {version = "4.6", features = ["derive"]}
colored = "3.0"
imagesize = "0.15"
indicatif = {version = "0.18.0", features = ["rayon"]}
infer = "0.22"
kamadak-exif = "0.6"
libcaesium = "0.21.1"
rayon = "1.11"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
walkdir = "2.5"
wild = "2.2"

[dev-dependencies]
image = "0.25"
tempfile = "3.21"
